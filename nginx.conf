server {
 listen 80;
 client_max_body_size 21m;
 root /usr/share/nginx/html;
 location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
 location /swagger { proxy_pass http://backend:8000; }
 location /redoc { proxy_pass http://backend:8000; }
 location /openapi.json { proxy_pass http://backend:8000; }
 location / { try_files $uri $uri/ /index.html; }
}
