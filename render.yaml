# Blueprint path in this repository: render.yaml
# Free web service with embedded SQLite and local storage demo mode.
services:
  - type: web
    name: polaris
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile.hosted
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: DATA_DIR
        value: /polaris/data
      - key: STORAGE_PROVIDER
        value: local
