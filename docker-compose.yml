services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U polaris"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://polaris:${POSTGRES_PASSWORD}@postgres/polaris
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      DATA_DIR: /polaris/data
    volumes: [research_data:/polaris/data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *backend_env
    volumes: [research_data:/polaris/data]
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["8000:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  research_data:
